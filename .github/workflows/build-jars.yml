name: Build JARs
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build Maven packages
        run: mvn --batch-mode -Dmaven.javadoc.skip=true package
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: unidbg-jars
          path: '**/target/*.jar'
          if-no-files-found: error